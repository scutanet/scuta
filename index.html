<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SCUTA.IO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='35%25'><stop offset='0%25' stop-color='%23a8ffd0'/><stop offset='55%25' stop-color='%2328d47a'/><stop offset='100%25' stop-color='%230a6b40'/></radialGradient></defs><circle cx='50' cy='50' r='46' fill='url(%23g)'/><circle cx='36' cy='40' r='9' fill='%23fff'/><circle cx='64' cy='40' r='9' fill='%23fff'/><circle cx='38' cy='41' r='4' fill='%23111'/><circle cx='66' cy='41' r='4' fill='%23111'/></svg>" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="lobby">
    <div class="lobby-bg" aria-hidden="true">
      <div class="lobby-stripes"></div>
      <div class="lobby-particles"></div>
    </div>

    <button type="button" id="settings-btn" class="corner-btn corner-settings" aria-label="Settings">
      <span class="corner-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </span>
      <span class="corner-label">Settings</span>
    </button>

    <div class="lobby-center">
      <div class="lobby-brand">
        <div class="logo-snake" aria-hidden="true">
          <svg viewBox="0 0 280 120" width="280" height="120">
            <defs>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g filter="url(#glow)">
              <circle cx="36" cy="78" r="18" fill="#ff4d6d"/>
              <circle cx="58" cy="68" r="18" fill="#ff9f1a"/>
              <circle cx="80" cy="58" r="18" fill="#ffe14a"/>
              <circle cx="102" cy="50" r="18" fill="#3dff7a"/>
              <circle cx="124" cy="46" r="18" fill="#4aa8ff"/>
              <circle cx="146" cy="48" r="18" fill="#b57bff"/>
              <circle cx="168" cy="54" r="19" fill="#1a1a1a"/>
              <circle cx="190" cy="58" r="20" fill="#f2f2f2"/>
              <circle cx="212" cy="56" r="21" fill="#1a1a1a"/>
              <circle cx="236" cy="52" r="24" fill="#2a2a2a"/>
              <circle cx="228" cy="44" r="9" fill="#fff"/>
              <circle cx="248" cy="44" r="9" fill="#fff"/>
              <circle cx="231" cy="45" r="4" fill="#111"/>
              <circle cx="251" cy="45" r="4" fill="#111"/>
            </g>
          </svg>
        </div>
        <h1 class="logo-title">Scuta.io</h1>
      </div>

      <div class="nick-block">
        <label class="nick-label" for="nick">Nickname</label>
        <input id="nick" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off" spellcheck="false" />
      </div>

      <div class="lobby-actions">
        <button type="button" id="play-btn" class="btn-play">PLAY OFFLINE</button>
        <button type="button" id="online-btn" class="btn-online" disabled aria-disabled="true">
          <svg class="lock-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7zm2 8.7V18h2v-2.3a1.5 1.5 0 1 0-2 0z"/>
          </svg>
          ONLINE — COMING SOON
        </button>
      </div>
    </div>

    <button type="button" id="customize-btn" class="corner-btn corner-customize" aria-label="Customize Snake">
      <span class="corner-icon snake-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <circle cx="14" cy="40" r="9" fill="#3dff7a"/>
          <circle cx="26" cy="34" r="9" fill="#1db954"/>
          <circle cx="38" cy="30" r="10" fill="#3dff7a"/>
          <circle cx="50" cy="28" r="11" fill="#1a1a1a"/>
          <circle cx="46" cy="24" r="4.5" fill="#fff"/>
          <circle cx="54" cy="24" r="4.5" fill="#fff"/>
          <circle cx="47.5" cy="24.5" r="2" fill="#111"/>
          <circle cx="55.5" cy="24.5" r="2" fill="#111"/>
        </svg>
      </span>
      <span class="corner-label">Customize Snake</span>
    </button>

    <button type="button" id="server-btn" class="corner-btn corner-server" aria-label="Choose Server">
      <span class="corner-icon globe-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#E0E0E0" stroke-width="2.2">
          <circle cx="32" cy="32" r="22"/>
          <ellipse cx="32" cy="32" rx="10" ry="22"/>
          <path d="M10 32h44M14 22h36M14 42h36"/>
        </svg>
      </span>
      <span class="corner-label">Choose Server</span>
    </button>

    <div id="lobby-modal" class="lobby-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="lobby-modal-card">
        <h2 id="modal-title">Settings</h2>
        <div id="modal-body" class="lobby-modal-body"></div>
        <button type="button" id="modal-close" class="btn-modal-close">Close</button>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="score-box">
      <div>Your length: <span id="length">0</span></div>
      <div>Your rank: <span id="rank">—</span></div>
    </div>
    <div id="leaderboard">
      <div class="lb-title">Leaderboard</div>
      <ol id="lb-list"></ol>
    </div>
    <div id="minimap-wrap">
      <canvas id="minimap" width="160" height="160"></canvas>
      <div id="server-label">server 8080</div>
    </div>
    <button id="boost-btn" type="button" aria-label="Boost">Boost</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
