<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SCUTA.IO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='35%25' cy='35%25'><stop offset='0%25' stop-color='%23ffe0a0'/><stop offset='55%25' stop-color='%23f7931a'/><stop offset='100%25' stop-color='%237a3d00'/></radialGradient></defs><circle cx='50' cy='50' r='46' fill='url(%23g)'/><text x='50' y='64' text-anchor='middle' font-size='52' font-family='Arial Black,sans-serif' fill='%23110a00'>₿</text></svg>" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="lobby">
    <div class="lobby-bg" aria-hidden="true">
      <div class="lobby-floor"></div>
      <div class="lobby-hexmesh"></div>
      <svg class="lobby-chain" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f7931a" stop-opacity="0.15"/>
            <stop offset="50%" stop-color="#26a17b" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#2775ca" stop-opacity="0.2"/>
          </linearGradient>
          <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g class="chain-links" fill="none" stroke="url(#linkGrad)" stroke-width="1.4">
          <path class="link" d="M120 160 L280 220 L420 140 L580 200 L740 120 L900 190 L1080 150 L1280 210"/>
          <path class="link" d="M90 420 L250 380 L410 460 L560 390 L720 470 L880 400 L1040 480 L1220 410 L1340 460"/>
          <path class="link" d="M140 720 L300 660 L460 740 L620 670 L780 750 L960 680 L1140 740 L1320 690"/>
          <path class="link" d="M280 220 L250 380 L300 660"/>
          <path class="link" d="M580 200 L560 390 L620 670"/>
          <path class="link" d="M900 190 L880 400 L960 680"/>
          <path class="link" d="M1080 150 L1040 480 L1140 740"/>
          <path class="link" d="M420 140 L410 460 L460 740"/>
          <path class="link" d="M740 120 L720 470 L780 750"/>
        </g>
        <g class="chain-packets" fill="none" stroke="#f7931a" stroke-width="2" stroke-linecap="round">
          <path class="packet p1" pathLength="100" d="M120 160 L280 220 L420 140 L580 200 L740 120 L900 190 L1080 150 L1280 210"/>
          <path class="packet p2" pathLength="100" d="M90 420 L250 380 L410 460 L560 390 L720 470 L880 400 L1040 480 L1220 410 L1340 460"/>
          <path class="packet p3" pathLength="100" d="M140 720 L300 660 L460 740 L620 670 L780 750 L960 680 L1140 740 L1320 690"/>
        </g>
        <g class="chain-nodes" filter="url(#nodeGlow)">
          <circle class="node n1" cx="120" cy="160" r="5"/><circle class="node n2" cx="280" cy="220" r="6"/>
          <circle class="node n3" cx="420" cy="140" r="5"/><circle class="node n4" cx="580" cy="200" r="7"/>
          <circle class="node n5" cx="740" cy="120" r="5"/><circle class="node n6" cx="900" cy="190" r="6"/>
          <circle class="node n7" cx="1080" cy="150" r="5"/><circle class="node n8" cx="1280" cy="210" r="6"/>
          <circle class="node n9" cx="90" cy="420" r="5"/><circle class="node n10" cx="250" cy="380" r="6"/>
          <circle class="node n11" cx="410" cy="460" r="7"/><circle class="node n12" cx="560" cy="390" r="5"/>
          <circle class="node n13" cx="720" cy="470" r="6"/><circle class="node n14" cx="880" cy="400" r="7"/>
          <circle class="node n15" cx="1040" cy="480" r="5"/><circle class="node n16" cx="1220" cy="410" r="6"/>
          <circle class="node n17" cx="1340" cy="460" r="5"/><circle class="node n18" cx="140" cy="720" r="5"/>
          <circle class="node n19" cx="300" cy="660" r="6"/><circle class="node n20" cx="460" cy="740" r="5"/>
          <circle class="node n21" cx="620" cy="670" r="7"/><circle class="node n22" cx="780" cy="750" r="5"/>
          <circle class="node n23" cx="960" cy="680" r="6"/><circle class="node n24" cx="1140" cy="740" r="5"/>
          <circle class="node n25" cx="1320" cy="690" r="6"/>
        </g>
        <g class="chain-blocks" fill="none" stroke-width="1.2">
          <rect class="block b1" x="248" y="196" width="28" height="20" rx="3"/>
          <rect class="block b2" x="546" y="176" width="28" height="20" rx="3"/>
          <rect class="block b3" x="866" y="376" width="28" height="20" rx="3"/>
          <rect class="block b4" x="606" y="646" width="28" height="20" rx="3"/>
          <rect class="block b5" x="1026" y="456" width="28" height="20" rx="3"/>
          <rect class="block b6" x="396" y="436" width="28" height="20" rx="3"/>
        </g>
      </svg>
      <div class="lobby-vignette"></div>
      <div class="lobby-coins">
        <img class="float-coin c1" src="assets/food/neon/btc.png" alt="" />
        <img class="float-coin c2" src="assets/food/neon/eth.png" alt="" />
        <img class="float-coin c3" src="assets/food/neon/sol.png" alt="" />
        <img class="float-coin c4" src="assets/food/neon/usdt.png" alt="" />
        <img class="float-coin c5" src="assets/food/neon/bnb.png" alt="" />
        <img class="float-coin c6" src="assets/food/neon/xrp.png" alt="" />
        <img class="float-coin c7" src="assets/food/neon/doge.png" alt="" />
        <img class="float-coin c8" src="assets/food/neon/ada.png" alt="" />
        <img class="float-coin c9" src="assets/food/neon/usdc.png" alt="" />
        <img class="float-coin c10" src="assets/food/neon/trx.png" alt="" />
      </div>
      <div class="lobby-scan"></div>
    </div>

    <button type="button" id="settings-btn" class="corner-btn corner-settings" aria-label="Settings">
      <span class="corner-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </span>
      <span class="corner-label">Settings</span>
    </button>

    <div class="lobby-center">
      <div class="lobby-brand">
        <div class="logo-snake" aria-hidden="true">
          <svg id="logo-svg" viewBox="0 8 290 100" width="900" height="310">
            <defs>
              <filter id="logo-glow" x="-35%" y="-35%" width="170%" height="170%">
                <feGaussianBlur stdDeviation="2.2" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="head-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.6" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <radialGradient id="logo-head-face" cx="36%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#2a2a32"/>
                <stop offset="55%" stop-color="#121218"/>
                <stop offset="100%" stop-color="#050508"/>
              </radialGradient>
              <radialGradient id="logo-head-core" cx="50%" cy="48%" r="42%">
                <stop offset="0%" stop-color="#0a0a0e" stop-opacity="0.92"/>
                <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="logo-head-rim" x1="15%" y1="10%" x2="90%" y2="95%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="40%" stop-color="#b8c4d8"/>
                <stop offset="100%" stop-color="#6a7388"/>
              </linearGradient>
              <clipPath id="logo-head-clip">
                <circle cx="244" cy="64" r="25"/>
              </clipPath>
            </defs>

            <!-- Body: overlapping crypto coins along a sine curve -->
            <g class="logo-body" filter="url(#logo-glow)">
              <image class="logo-seg" href="assets/food/neon/ada.png"  x="6"    y="50"   width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/doge.png" x="22"   y="58"   width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/trx.png"  x="38"   y="62"   width="46" height="46" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/sol.png"  x="56"   y="56"   width="50" height="50" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/usdc.png" x="76"   y="44"   width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/xrp.png"  x="98"   y="30"   width="56" height="56" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/bnb.png"  x="120"  y="20"   width="58" height="58" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/usdt.png" x="142"  y="16"   width="60" height="60" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/eth.png"  x="164"  y="22"   width="62" height="62" preserveAspectRatio="xMidYMid meet"/>
              <image class="logo-seg" href="assets/food/neon/btc.png"  x="186"  y="32"   width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
            </g>

            <!-- Head: platinum neon coin (avoids orange-on-orange with BTC) -->
            <g class="logo-head">
              <circle cx="244" cy="64" r="28" fill="#b8c4d8" opacity="0.12" filter="url(#head-glow)"/>

              <circle cx="244" cy="64" r="25" fill="url(#logo-head-face)"/>

              <g clip-path="url(#logo-head-clip)" fill="none" stroke="#c5d0e2" stroke-linecap="round">
                <circle cx="244" cy="64" r="18.5" stroke-width="0.9" opacity="0.4"/>
                <circle cx="244" cy="64" r="12.5" stroke-width="0.7" opacity="0.25"/>
                <path d="M244 46.5 V52.5 M244 75.5 V81.5 M225.5 64 H231.5 M256.5 64 H262.5" stroke-width="0.75" opacity="0.5"/>
                <path d="M231 51 L236 56 M257 51 L252 56 M231 77 L236 72 M257 77 L252 72" stroke-width="0.7" opacity="0.42"/>
                <path d="M236 46.8 L239 52 M252 46.8 L249 52 M236 81.2 L239 76 M252 81.2 L249 76" stroke-width="0.65" opacity="0.35"/>
                <circle cx="244" cy="46.5" r="1.15" fill="#e8eef8" stroke="none" opacity="0.8"/>
                <circle cx="244" cy="81.5" r="1.15" fill="#e8eef8" stroke="none" opacity="0.8"/>
                <circle cx="225.5" cy="64" r="1.15" fill="#e8eef8" stroke="none" opacity="0.8"/>
                <circle cx="262.5" cy="64" r="1.15" fill="#e8eef8" stroke="none" opacity="0.8"/>
                <circle cx="231" cy="51" r="0.95" fill="#c5d0e2" stroke="none" opacity="0.7"/>
                <circle cx="257" cy="51" r="0.95" fill="#c5d0e2" stroke="none" opacity="0.7"/>
                <circle cx="231" cy="77" r="0.95" fill="#c5d0e2" stroke="none" opacity="0.7"/>
                <circle cx="257" cy="77" r="0.95" fill="#c5d0e2" stroke="none" opacity="0.7"/>
              </g>

              <circle cx="244" cy="64" r="24.15" fill="none" stroke="url(#logo-head-rim)" stroke-width="2.1"/>
              <circle cx="244" cy="64" r="21.6" fill="none" stroke="#dce3f0" stroke-opacity="0.4" stroke-width="1"/>

              <path d="M221.8 52.5 A24 24 0 0 0 221.8 75.5" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
              <ellipse cx="236" cy="52" rx="9" ry="5.5" fill="#fff" opacity="0.08"/>

              <circle cx="244" cy="64" r="14.5" fill="url(#logo-head-core)"/>

              <g class="logo-eye" data-cx="235.4" data-cy="58.5" data-max="3.5">
                <circle cx="235.4" cy="58.5" r="7.8" fill="#fff"/>
                <circle cx="235.4" cy="58.5" r="7.8" fill="none" stroke="#c5d0e2" stroke-opacity="0.45" stroke-width="0.85"/>
                <g class="logo-pupil" transform="translate(236.8 59.3)">
                  <circle cx="0" cy="0" r="3.5" fill="#111"/>
                  <circle cx="1.05" cy="-1.15" r="1.1" fill="#fff" opacity="0.95"/>
                </g>
              </g>
              <g class="logo-eye" data-cx="252.6" data-cy="58.5" data-max="3.5">
                <circle cx="252.6" cy="58.5" r="7.8" fill="#fff"/>
                <circle cx="252.6" cy="58.5" r="7.8" fill="none" stroke="#c5d0e2" stroke-opacity="0.45" stroke-width="0.85"/>
                <g class="logo-pupil" transform="translate(254 59.3)">
                  <circle cx="0" cy="0" r="3.5" fill="#111"/>
                  <circle cx="1.05" cy="-1.15" r="1.1" fill="#fff" opacity="0.95"/>
                </g>
              </g>
            </g>
          </svg>
        </div>
        <h1 class="logo-title">SCUTA.IO</h1>
        <p class="logo-tag">Eat the market. Grow your stack.</p>
      </div>

      <div class="nick-block">
        <label class="nick-label" for="nick">Trader name</label>
        <div class="nick-field">
          <span class="nick-prefix" aria-hidden="true">$</span>
          <input id="nick" type="text" maxlength="16" placeholder="Enter handle" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="lobby-actions">
        <button type="button" id="play-btn" class="btn-play">
          <span class="btn-play-shine" aria-hidden="true"></span>
          <span class="btn-play-label">PLAY OFFLINE</span>
        </button>
        <button type="button" id="online-btn" class="btn-online" disabled aria-disabled="true">
          <svg class="lock-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7zm2 8.7V18h2v-2.3a1.5 1.5 0 1 0-2 0z"/>
          </svg>
          ONLINE — COMING SOON
        </button>
      </div>
    </div>

    <button type="button" id="customize-btn" class="corner-btn corner-customize" aria-label="Customize Snake">
      <span class="corner-icon snake-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56">
          <circle cx="14" cy="40" r="9" fill="#f7931a"/>
          <circle cx="26" cy="34" r="9" fill="#26a17b"/>
          <circle cx="38" cy="30" r="10" fill="#14f195"/>
          <circle cx="50" cy="28" r="11" fill="#141418"/>
          <circle cx="50" cy="28" r="11" fill="none" stroke="#f7931a" stroke-width="1.6"/>
          <circle cx="46" cy="24" r="4.5" fill="#fff"/>
          <circle cx="54" cy="24" r="4.5" fill="#fff"/>
          <circle cx="47.5" cy="24.5" r="2" fill="#111"/>
          <circle cx="55.5" cy="24.5" r="2" fill="#111"/>
        </svg>
      </span>
      <span class="corner-label">Customize</span>
    </button>

    <button type="button" id="server-btn" class="corner-btn corner-server" aria-label="Liquidity Pools">
      <span class="corner-icon pool-icon" aria-hidden="true">
        <img src="assets/food/neon/btc.png" alt="" width="48" height="48" />
      </span>
      <span class="corner-label">Liquidity Pools</span>
    </button>

    <div id="lobby-modal" class="lobby-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="lobby-modal-card">
        <h2 id="modal-title">Settings</h2>
        <div id="modal-body" class="lobby-modal-body"></div>
        <button type="button" id="modal-close" class="btn-modal-close">Close</button>
      </div>
    </div>

    <div id="lobby-toast" class="lobby-toast hidden" aria-live="polite"></div>

    <div id="pools-screen" class="pools-screen hidden" role="dialog" aria-modal="true" aria-label="Liquidity Pools">
      <div class="pools-bg" aria-hidden="true"></div>

      <header class="pools-header">
        <div class="pools-wallet">
          <div class="pools-wallet-text">
            <span class="pools-wallet-label">DEMO WALLET</span>
            <span id="pools-wallet-balance" class="pools-wallet-balance">$500.00</span>
          </div>
          <button type="button" class="pools-wallet-topup" data-action="topup" title="Top up demo wallet" aria-label="Top up">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M2 10h20"/>
              <circle cx="16" cy="14" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="pools-stage">
        <button type="button" id="pools-prev" class="pools-arrow" aria-label="Previous pool">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5 L8 12 L15 19"/></svg>
        </button>

        <div id="pools-carousel" class="pools-carousel" tabindex="0" aria-label="Liquidity pool carousel"></div>

        <button type="button" id="pools-next" class="pools-arrow" aria-label="Next pool">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5 L16 12 L9 19"/></svg>
        </button>
      </div>

      <button type="button" id="pools-close" class="pools-close">BACK</button>
    </div>

    <div id="customize-screen" class="customize-screen hidden" role="dialog" aria-modal="true" aria-label="Customize Snake">
      <div class="cust-stage-bg" aria-hidden="true">
        <div class="cust-hexmesh"></div>
      </div>

      <button type="button" id="cust-bg-btn" class="cust-corner cust-bg" aria-label="Change Background">
        <span class="cust-corner-icon cust-bg-preview" aria-hidden="true"></span>
        <span class="cust-corner-label">Change Background</span>
      </button>

      <button type="button" id="cust-cosmetic-btn" class="cust-corner cust-cosmetic" aria-label="Select Cosmetic">
        <span class="cust-corner-icon" aria-hidden="true">
          <svg viewBox="0 0 72 56" width="72" height="56">
            <circle cx="18" cy="34" r="8" fill="#9b5cff"/>
            <circle cx="30" cy="30" r="8" fill="#7c3aed"/>
            <circle cx="42" cy="28" r="9" fill="#9b5cff"/>
            <circle cx="54" cy="26" r="11" fill="#1a1a1a"/>
            <circle cx="50" cy="22" r="4.5" fill="#fff"/>
            <circle cx="58" cy="22" r="4.5" fill="#fff"/>
            <circle cx="51.2" cy="22.5" r="2" fill="#111"/>
            <circle cx="59.2" cy="22.5" r="2" fill="#111"/>
            <rect x="46" y="18" width="16" height="3.2" rx="1.2" fill="#222" stroke="#888" stroke-width="1"/>
            <path d="M42 20 Q36 8 48 10 Q54 4 62 12 Q66 18 58 20" fill="#6ec8ff" opacity="0.9"/>
            <path d="M66 20 Q72 8 58 6 Q68 2 74 14 Q72 22 66 20" fill="#6ec8ff" opacity="0.75"/>
          </svg>
        </span>
        <span class="cust-corner-label">Select Cosmetic</span>
      </button>

      <div class="cust-stage">
        <button type="button" id="cust-prev" class="cust-arrow cust-arrow-prev" aria-label="Previous skin">
          <svg viewBox="0 0 48 80" width="48" height="80" aria-hidden="true">
            <path d="M34 8 L10 40 L34 72" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div id="cust-carousel" class="cust-preview" tabindex="0" aria-label="Snake skins" role="listbox">
          <div id="cust-skin-view" class="cust-skin-view" aria-live="polite"></div>
          <div id="cust-skin-name" class="cust-skin-name"></div>
        </div>

        <button type="button" id="cust-next" class="cust-arrow cust-arrow-next" aria-label="Next skin">
          <svg viewBox="0 0 48 80" width="48" height="80" aria-hidden="true">
            <path d="M14 8 L38 40 L14 72" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button type="button" id="cust-ok-btn" class="cust-ok">OK</button>

      <button type="button" id="cust-build-btn" class="cust-corner cust-build" aria-label="Build a Slither">
        <span class="cust-corner-icon" aria-hidden="true">
          <svg viewBox="0 0 72 40" width="72" height="40">
            <circle cx="8" cy="22" r="7" fill="#7c3aed"/>
            <circle cx="18" cy="18" r="7" fill="#e91e8c"/>
            <circle cx="28" cy="16" r="7" fill="#ff4d4d"/>
            <circle cx="38" cy="18" r="7" fill="#ff9f1a"/>
            <circle cx="48" cy="20" r="7" fill="#ffe14a"/>
            <circle cx="58" cy="18" r="8" fill="#3dff7a"/>
            <circle cx="54.5" cy="14" r="3.2" fill="#fff"/>
            <circle cx="61.5" cy="14" r="3.2" fill="#fff"/>
            <circle cx="55.2" cy="14.4" r="1.4" fill="#111"/>
            <circle cx="62.2" cy="14.4" r="1.4" fill="#111"/>
          </svg>
        </span>
        <span class="cust-corner-label">Build a Slither</span>
      </button>

      <div id="cust-toast" class="cust-toast hidden" aria-live="polite"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="score-box">
      <div class="hud-value">Carrying: <span id="carried-value">$0.00</span></div>
